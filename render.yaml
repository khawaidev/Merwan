services:
  - type: web
    name: mlbb-diamond-store
    env: node
    buildCommand: "npm run build"
    startCommand: "npm run start:server"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
